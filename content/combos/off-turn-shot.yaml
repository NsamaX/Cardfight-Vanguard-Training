# Tutorial combo in combo-trial style: the player must follow the steps one at a time, correctly
# setup = board state at the start, steps = actions to perform (action matches Action in src/engine/types.ts)
# "pay cost / use ability" = action: choose, option: "yes"
# Cards are referenced by card code (see "Content files" in README.md)

id: off-turn-shot
name: Off-turn shot combo
difficulty: 2                    # 1-5
summary: >
  On the bot's turn, use Negrolily to retire your own Skeleton Cannoneer so Nightrose calls it back,
  then Skeleton Cannoneer shoots the bot's rear-guard: you survive, get CC back, and draw
tags: [Opponent's turn, G GUARDIAN, Hollow]

setup:
  turn: opp
  phase: battle
  step: guard
  attack:                        # the bot is attacking our vanguard
    attacker: PR/0686TH          # the bot's Nightrose (G)
    power: 33000
    target: vc
  me:
    vc: G-CHB03/S11TH            # Nightrose (Night Fog)
    rc:
      front_left: G-BT06/087TH   # Skeleton Cannoneer (the one that gets retired and comes back)
      front_right: PR/0256TH
      back_left: G-BT06/040TH
      back_center: null          # empty circle: Negrolily calls a ghostie here
      back_right: G-CP06/019TH
    hand: [PR/0740TH, G-CHB03/002TH, G-BT06/S11TH]
    damage: { up: 3, down: 1 }
    soul: 3
    drop: [G-CHB03/S12TH, PR/0740TH, PR/0632TH]
    g_zone: { up: [PR/0686TH, PR/0686TH], down: [G-CP08/S11TH, G-CP08/S11TH, PR/0686TH] }   # GB2
    deck: 26
  opp:
    vc: PR/0686TH
    heart: G-CHB03/002TH
    rc:
      front_left: G-CP06/019TH
      front_right: G-BT06/087TH
      back_center: G-BT06/040TH
    hand: 5
    damage: { up: 2, down: 2 }

steps:
  - action: call-g-guardian
    card: G-CP08/S11TH
    discard: PR/0740TH
    hint: Call Negrolily as a G guardian by discarding Dewey the Ghostie (has the Heal icon)
  - action: order-queue
    first: PR/0740TH
    hint: >
      Two AUTO abilities are waiting (Dewey discarded, Negrolily entered GC). Resolve Dewey first
      to get CC back for paying Negrolily's CB
  - action: choose
    option: "yes"
    card: PR/0740TH
    bind: PR/0740TH              # bind another Heal from the drop zone
  - action: choose
    option: CC(1)
    hint: Choose CC1
  - action: choose
    option: "yes"
    card: G-CP08/S11TH
    retire: front_left
    hint: Negrolily pays CB1 and retires your own Skeleton Cannoneer
  - action: select-target
    from: drop
    card: G-CHB03/S12TH
    to: back_center
    hint: Call Tommy the Ghostie Brothers to the empty circle; Negrolily gets Shield+10000 (36,000 total, enough to guard)
  - action: choose
    option: "yes"
    card: G-CHB03/S11TH
    hint: Nightrose (Night Fog) triggers because a rear-guard went to the drop; pay mill 3
  - action: select-target
    from: drop
    card: G-BT06/087TH
    to: front_left
    hint: Call Skeleton Cannoneer back to its original circle
  - action: order-queue
    first: hollow
    hint: Skeleton Cannoneer has 2 AUTO abilities waiting. Resolve hollow first to draw a card from the second ability
  - action: choose
    option: hollow
    hint: Becomes hollowed (retired at the end of the bot's turn)
  - action: choose
    option: "yes"
    card: G-BT06/087TH
    hint: Pay CB1
  - action: select-target
    side: opp
    to: front_left
    hint: Shoot the bot rear-guard that would attack next, then draw 1 card because it is hollowed

result: >
  Attack guarded, bot loses 1 rear-guard, +1 card drawn, CB: 2 used, 1 returned
