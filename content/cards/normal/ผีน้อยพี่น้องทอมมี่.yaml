ids: ["G-CHB03/S12TH SP", "G-BT06/039TH SP"]
name: "ผีน้อยพี่น้องทอมมี่"
format: [G]
type: normal
grade: 1
power: 7000
race: "โกสต์"
clan: "แกรนบลู"
abilities:
  - kind: "AUTO"
    timing: "enter(RC, self, from=hand)"
    cost: ["reveal(1, filter=grade-3)"]
    effect: ["search(deck→hand, n≤1, filter=grade-3 & name(\"ไนท์โรส\"))", "discard(1)"]
  - kind: "CONT"
    zone: "มือ"
    cond: ["while(stride-cost)"]
    effect: ["grade(+2, self)"]
text: |
  ### AUTO

  - **จังหวะ:** เมื่อยูนิทนี้เข้าสู่ช่อง (RC) จากมือคุณ | **คอสต์:** เลือกแสดงการ์ดเกรด 3 บนมือคุณ 1 ใบ
    - **ผล:** สามารถจ่ายค่าคอสท์ ถ้าจ่าย, ค้นหาการ์ดเกรด 3 ที่มีคำว่า "ไนท์โรส" ในชื่อการ์ดจากกองการ์ดคุณไม่เกิน 1 ใบ, แสดงและนำขึ้นมือคุณ, สลับกองการ์ดคุณ, จากนั้นเลือกทิ้งการ์ดบนมือคุณ 1 ใบ

  ### CONT

  - **ช่อง:** มือ
    - **ผล:** ในขณะที่คุณจ่ายค่าคอสท์เพื่อทำการ STRIDE, การ์ดนี้เกรด +2
notes: |
  มี 2 ใบ ต่างกันที่ภาพและหมายเลขการ์ด ส่วนข้อความความสามารถตรงกันทุกคำ จึงรวมไว้ในไฟล์เดียว
