text: |
  ### AUTO

  - **ช่อง:** RC | **เงื่อนไข:** GB1 | **จังหวะ:** เมื่อจบการต่อสู้ที่ยูนิทนี้ทำการบูสท์ให้เรียร์การ์ด | **คอสต์:** CB1
    - **ผล:** ถ้าแวนการ์ดคุณมีคำว่า "ไนท์โรส" ในชื่อการ์ด, สามารถจ่ายค่าคอสท์ ถ้าจ่าย, รีไทร์ยูนิทที่ถูกบูสท์ในการต่อสู้นั้น, เลือกการ์ดที่มีความสามารถฮอลโล่ว์จากดรอปโซนของคุณไม่เกิน 1 ใบ, คอลลงช่อง (RC)
