text: |
  ### AUTO

  - ฮอลโล่ว์
  - **ช่อง:** VC/RC | **เงื่อนไข:** 1/Turn GB2 | **จังหวะ:** ในเทิร์นคุณ, เมื่อยูนิทคุณเข้าสู่ช่อง (RC) ช่องอื่นจากดรอปโซน | **คอสต์:** SB1
    - **ผล:** คุณสามารถจ่ายค่าคอสต์ ถ้าจ่าย, เลือกการ์ดเกรด 1 จากดรอปโซนคุณ 1 ใบ, คอลลงช่อง (RC) อื่นในแถวแนวตั้งเดียวกับยูนิทนี้
  - **ช่อง:** VC | **จังหวะ:** ในเทิร์นคุณ, เมื่อคุณทำการ STRIDE G ยูนิท | **คอสต์:** CB1
    - **ผล:** คุณสามารถจ่ายค่าคอสต์ ถ้าจ่าย, ส่งการ์ดไม่เกิน 3 ใบบนสุดจากกองการ์ดคุณลงดรอปโซน, เลือกการ์ดจากดรอปโซนคุณ 1 ใบ, คอลลงช่อง (RC), ถ้ายูนิทนั้นมีความสามารถฮอลโล่ว์, จนจบเทิร์น, ยูนิทนั้นได้รับ Power+3000
