ids: ["G-CP06/019TH RR (ประทับ Fighters Road Thailand 2018)"]
name: "หมออาคมแห่งความเหนื่อยหน่าย, เนโครเลซี่"
format: [G]
type: normal
grade: 2
power: 9000
race: "เดม่อน"
clan: "แกรนบลู"
abilities:
  - kind: "AUTO"
    timing: "enter(RC, self)"
    effect: ["hollow(self)", "retire(self, at=turn-end, if=self-hollowed)"]
  - kind: "AUTO"
    timing: "enter(RC, self)"
    cond: ["GB(1)", "vc-name(\"ไนท์โรส\")"]
    cost: ["CB(1)", "SB(1)"]
    effect: ["call(drop→RC, n≤1, filter=grade≤2 & not-same-name)", "power(+2000, self, until=turn-end)", "grant(AUTO[to-drop(self, from=RC, by=hollow) → choose(CC(1), SC(1))], self, until=turn-end)"]
text: |
  ### AUTO

  - ฮอลโล่ว์
  - **เงื่อนไข:** GB1 | **จังหวะ:** เมื่อยูนิทนี้เข้าสู่ช่อง (RC) | **คอสต์:** CB1, SB1
    - **ผล:** ถ้าแวนการ์ดคุณมีคำว่า "ไนท์โรส" ในชื่อการ์ด, สามารถจ่ายค่าคอสท์ ถ้าจ่าย, เลือกการ์ดเกรด 2 หรือต่ำกว่าที่ไม่ใช่ชื่อ "หมออาคมแห่งความเหนื่อยหน่าย, เนโครเลซี่" จากดรอปโซนคุณไม่เกิน 1 ใบ, คอลลงช่อง (RC), จนจบเทิร์น, ยูนิทนี้ได้รับ Power+2000, และได้รับความสามารถ "AUTO: เมื่อยูนิทนี้ตกลงดรอปโซนคุณจากช่อง (RC) โดยความสามารถฮอลโล่ว์, CC1 / SC1"
