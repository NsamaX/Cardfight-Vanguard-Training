ids: ["G-CP06/037TH (ตัวอักษรเรดริตี้ถูกตัดขอบ)"]
name: "ราชาผีน้อย, โอบาไดอา"
format: [G]
type: g-unit
grade: 4
power: "15000+"
race: "โกสต์"
clan: "แกรนบลู"
abilities:
  - kind: "STRIDE"
    timing: "step(stride, own)"
    cost: ["discard(n, grade-sum≥3)"]
    effect: ["stride(self)"]
  - kind: "AUTO"
    timing: "enter(VC, self)"
    effect: ["search(deck→drop, n≤3)", "call(drop→RC, n≤1, filter=normal-unit & name(\"ผีน้อย\"), to=same-column, if=hollow-milled≥2)"]
text: |
  ### STRIDE

  - **ช่วงเวลา:** สไตรด์สเต็ป | **คอสต์:** เลือกทิ้งการ์ด 1 ใบหรือมากกว่าที่มีผลรวมเกรดการ์ดเป็น 3 หรือสูงกว่าจากมือคุณ
    - **ผล:** STRIDE การ์ดนี้ลงช่อง (VC) ของคุณจากสภาพคว่ำการ์ด

  ### AUTO

  - **จังหวะ:** เมื่อยูนิทนี้เข้าสู่ช่อง (VC)
    - **ผล:** ค้นหาการ์ดจากกองการ์ดคุณไม่เกิน 3 ใบ, นำการ์ดทั้งหมดนั้นที่เลือกลงช่องดรอปโซนคุณ, สลับกองการ์ดคุณ, และถ้ามีการ์ดที่มีความสามารถฮอลโล่ว์ตกลงดรอปโซนคุณ 2 ใบหรือมากกว่าจากความสามารถนี้, เลือกนอมอลยูนิทที่มีคำว่า "ผีน้อย" ในชื่อการ์ดจากดรอปโซนคุณไม่เกิน 1 ใบ, คอลลงช่อง (RC) ในแถวแนวตั้งเดียวกับยูนิทนี้
