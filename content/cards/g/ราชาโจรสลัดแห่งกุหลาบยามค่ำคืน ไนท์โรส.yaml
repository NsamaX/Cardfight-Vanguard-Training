ids: ["PR/0686TH"]
name: "ราชาโจรสลัดแห่งกุหลาบยามค่ำคืน ไนท์โรส"
format: [G]
type: g-unit
grade: 4
power: "15000+"
race: "แวมไพร์"
clan: "แกรนบลู"
abilities:
  - kind: "STRIDE"
    timing: "step(stride, own)"
    cost: ["discard(n, grade-sum≥3)"]
    effect: ["stride(self)"]
  - kind: "AUTO"
    zone: "VC"
    timing: "phase-start(battle, own)"
    effect: ["power(+5000, own-units, n=count-in-drop(name(\"ไนท์โรส\")), until=turn-end)"]
  - kind: "ACT"
    zone: "VC"
    cond: ["1/turn"]
    cost: ["CB(1)", "flip-G-up(1, filter=same-name)"]
    effect: ["call(drop→RC, n≤G-faceup+1, to=different)", "hollow(called)", "critical(+1, self, if=called≥3)"]
text: |
  ### STRIDE

  - **ช่วงเวลา:** สไตรด์สเต็ป | **คอสต์:** เลือกทิ้งการ์ด 1 ใบหรือมากกว่าที่มีผลรวมเกรดการ์ดเป็น 3 หรือสูงกว่าจากมือคุณ
    - **ผล:** STRIDE การ์ดนี้ลงช่อง (VC) ของคุณจากสภาพคว่ำการ์ด

  ### AUTO

  - **ช่อง:** VC | **จังหวะ:** เมื่อเริ่มต้นช่วงแบทเทิลเฟสคุณ
    - **ผล:** เลือกยูนิทคุณตามจำนวนการ์ดที่มีคำว่า "ไนท์โรส" ในชื่อการ์ดที่อยู่ในดรอปโซนคุณ, จนจบเทิร์น, ยูนิทเหล่านั้นได้รับ Power+5000

  ### ACT

  - **ช่อง:** VC | **เงื่อนไข:** 1/Turn | **คอสต์:** CB1, เลือกหงายการ์ดที่มีชื่อเหมือนกับยูนิทนี้ที่คว่ำอยู่บน G โซนคุณ 1 ใบ
    - **ผล:** เลือกการ์ดจากดรอปโซนคุณไม่เกินจำนวนการ์ดที่หงายหน้าอยู่ใน G โซนคุณ +1, คอลการ์ดทั้งหมดนั้นที่เลือกลงช่อง (RC) ที่แตกต่างกันในสภาพฮอลโล่ว์, และถ้าคุณคอลการ์ด 3 ใบหรือมากกว่า, ยูนิทนี้ได้รับ Critical+1
