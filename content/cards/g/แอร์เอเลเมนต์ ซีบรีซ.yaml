ids: ["G-FC03/049TH RR"]
name: "แอร์เอเลเมนต์, ซีบรีซ"
format: [G]
type: g-unit
grade: 4
power: "15000+"
race: "เอเลเมนทัล"
clan: "เครย์เอเลเมนทัล"
abilities:
  - kind: "STRIDE"
    timing: "step(stride, own)"
    cost: ["discard(n, grade-sum≥3)"]
    effect: ["stride(self)"]
  - kind: "ACT"
    zone: "G โซน"
    cond: ["vc-grade=3 & G-faceup=0 & opp-vc-grade=2 & opp-no-ride-last-turn"]
    cost: ["CB(2)", "discard(1)"]
    effect: ["stride-from-G(self)"]
  - kind: "CONT"
    effect: ["all-clan(self)"]
text: |
  ### STRIDE

  - **ช่วงเวลา:** สไตรด์สเต็ป | **คอสต์:** เลือกทิ้งการ์ด 1 ใบหรือมากกว่าที่มีผลรวมเกรดการ์ดเป็น 3 หรือสูงกว่าจากมือคุณ
    - **ผล:** STRIDE การ์ดนี้ลงช่อง (VC) ของคุณจากสภาพคว่ำการ์ด

  ### ACT

  - **ช่อง:** G โซน | **คอสต์:** CB2, เลือกทิ้งการ์ดบนมือคุณ 1 ใบ
    - **ผล:** ถ้าแวนการ์ดคุณเป็นการ์ดเกรด 3, จำนวนการ์ดที่หงายหน้าบน G โซนคุณมี 0 ใบ, แวนการ์ดคู่แข่งเป็นการ์ดเกรด 2, และไม่มียูนิทของคู่แข่งเข้าสู่ช่อง (VC) ในช่วงไรด์เฟสในเทิร์นที่ผ่านมา, สไตรด์การ์ดนี้ลงบนช่อง (VC) คุณจากสภาพคว่ำการ์ด

  ### CONT

  - การ์ดนี้ถือว่าเป็นทุกแคลนและทุกเนชั่น
