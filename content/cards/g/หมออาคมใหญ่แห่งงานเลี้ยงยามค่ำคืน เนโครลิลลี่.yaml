abilities:
  - kind: "G GUARDIAN"
    timing: "step(guard, opp)"
    cost: ["discard(1, filter=heal)"]
    effect: ["call(G→GC, self)"]
  - kind: "AUTO"
    timing: "enter(GC, self)"
    cost: ["CB(1)", "retire-own(1)"]
    effect: ["call(drop→RC, n=1, filter=normal-unit & name(\"ผีน้อย\"), to=empty)", "shield(+10000, self, until=battle-end)"]
text: |
  ### G GUARDIAN

  - **ช่วงเวลา:** ในช่วงการ์ดสเต็ปของเทิร์นคู่แข่ง | **คอสต์:** เลือกทิ้งการ์ดที่มีความสามารถ [Heal] บนมือคุณ 1 ใบ
    - **ผล:** คอลการ์ดนี้ลงช่อง (GC) จากสภาพคว่ำการ์ด

  ### AUTO

  - **จังหวะ:** เมื่อยูนิทนี้เข้าสู่ช่อง (GC) | **คอสต์:** CB1, เลือกเรียร์การ์ดของคุณ 1 ใบ, รีไทร์ยูนิทนั้น
    - **ผล:** สามารถจ่ายค่าคอสท์ ถ้าจ่าย, เลือกนอมอลยูนิทที่มีคำว่า "ผีน้อย" ในชื่อการ์ดจากดรอปโซนคุณ 1 ใบ, คอลลงช่อง (RC) ที่ไม่มียูนิทอยู่, จนจบการต่อสู้, ยูนิทนี้ได้รับ Shield+10000
