text: |
  ### G GUARDIAN

  - **ช่วงเวลา:** ในช่วงการ์ดสเต็ปของเทิร์นคู่แข่ง | **คอสต์:** เลือกทิ้งการ์ดที่มีความสามารถ [Heal] บนมือคุณ 1 ใบ
    - **ผล:** คอลการ์ดนี้ลงช่อง (GC) จากสภาพคว่ำการ์ด

  ### AUTO

  - **เงื่อนไข:** GB1 | **จังหวะ:** เมื่อยูนิทนี้เข้าสู่ช่อง (GC) | **คอสต์:** SB1, เลือกหงาย G GUARDIAN ที่คว่ำอยู่บน G โซนคุณ 1 ใบ
    - **ผล:** คุณสามารถจ่ายค่าคอสต์ ถ้าจ่าย, เลือกการ์ดจากดรอปโซนคุณที่เกรดแตกต่างกัน 2 ใบ, คุณสามารถคอลการ์ดเหล่านั้นลงช่อง (GC) ได้
