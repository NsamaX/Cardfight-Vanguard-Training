abilities:
  - kind: "ULTIMATE STRIDE"
    timing: "step(stride, own)"
    cond: ["G-faceup≥3"]
    cost: ["discard(1, filter=same-name-as-VC)"]
    effect: ["stride(self)", "remove-G-zone(own, at=return-to-G)"]
  - kind: "AUTO"
    timing: "enter(VC, self)"
    cost: ["CB(2)"]
