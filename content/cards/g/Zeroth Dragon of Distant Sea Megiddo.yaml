text: |
  ### ULTIMATE STRIDE

  - **Timing:** Stride Step | **Cost:** Choose a card with the same card name as your vanguard from your hand, and discard it
    - **Effect:** STRIDE this card on your (VC) from face down.

  ### AUTO

  - **Timing:** When placed on (VC) | **Cost:** CB2
    - **Effect:** You may pay the cost. If you do, choose up to five cards in total from your hand or drop zone, call them to separate (RC), and until end of turn, they get Power+5000, and "AUTO (RC): At the end of the battle that this unit attacked, choose one of your other rear-guards, and you may exchange positions with this unit."
notes: |
  The clan field holds the nation Magallanica, as printed on the card.
