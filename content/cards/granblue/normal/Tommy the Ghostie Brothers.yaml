  ### AUTO

  - **Timing:** When this unit is placed on (RC) from hand | **Cost:** Choose a grade 3 card from your hand, and reveal it
    - **Effect:** You may pay the cost. If you do, search your deck for up to one grade 3 card with "Nightrose" in its card name, reveal it, put it into your hand, shuffle your deck, choose a card from your hand, and discard it.

  ### CONT

  - **Zone:** hand
    - **Effect:** While you are paying the cost for STRIDE, this card gets grade +2.
